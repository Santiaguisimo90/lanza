name: "Lanza image"
on:
  workflow_dispatch:
  push:
    branches: [lanza]
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push (amd64)
        run: |
          docker buildx build --platform linux/amd64 -f Dockerfile.dev \
            --build-arg NEXT_PUBLIC_VERSION=lanza-${{ github.sha }} \
            -t ghcr.io/santiaguisimo90/lanza:latest \
            -t ghcr.io/santiaguisimo90/lanza:${{ github.sha }} \
            --provenance=false --sbom=false --push .
