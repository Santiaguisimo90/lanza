# Lanza (Postiz con marca propia) - despliegue en VPS.
# Uso: copiar esta carpeta al VPS, crear .env desde .env.example y correr:
#   docker compose up -d
# Todas las claves salen de .env (nunca se suben al repo).
services:
  caddy:
    image: caddy:2-alpine
    container_name: lanza-caddy
    restart: always
    ports:
      - '80:80'
      - '443:443'
    environment:
      LANZA_DOMAIN: ${LANZA_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - lanza-network
    depends_on:
      - lanza

  lanza:
    image: ${LANZA_IMAGE:-ghcr.io/santiaguisimo90/lanza:latest}
    container_name: lanza
    restart: always
    environment:
      MAIN_URL: https://${LANZA_DOMAIN}
      FRONTEND_URL: https://${LANZA_DOMAIN}
      NEXT_PUBLIC_BACKEND_URL: https://${LANZA_DOMAIN}/api
      BACKEND_INTERNAL_URL: http://localhost:3000
      JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgresql://lanza:${POSTGRES_PASSWORD}@lanza-postgres:5432/lanza
      REDIS_URL: redis://lanza-redis:6379
      TEMPORAL_ADDRESS: temporal:7233
      IS_GENERAL: 'true'
      DISABLE_REGISTRATION: ${DISABLE_REGISTRATION:-false}
      NOT_SECURED: 'false'
      API_LIMIT: 100

      # Medios en Cloudflare R2 (no en el disco del VPS)
      STORAGE_PROVIDER: cloudflare
      CLOUDFLARE_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      CLOUDFLARE_ACCESS_KEY: ${R2_ACCESS_KEY_ID}
      CLOUDFLARE_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      CLOUDFLARE_BUCKETNAME: ${R2_BUCKET}
      CLOUDFLARE_BUCKET_URL: ${R2_PUBLIC_URL}
      CLOUDFLARE_REGION: auto

      # Cifrado de tokens de las redes en la base
      ENCRYPTION_PROVIDER: local
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}

      # Correo (opcional; si EMAIL_PROVIDER esta vacio, los usuarios se activan solos)
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-}
      EMAIL_FROM_NAME: Lanza
      RESEND_API_KEY: ${RESEND_API_KEY:-}

      # Apps de desarrollador de cada red (ver PENDIENTES_SANTIAGO.md)
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
      THREADS_APP_ID: ${THREADS_APP_ID:-}
      THREADS_APP_SECRET: ${THREADS_APP_SECRET:-}
      LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID:-}
      LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET:-}
      YOUTUBE_CLIENT_ID: ${YOUTUBE_CLIENT_ID:-}
      YOUTUBE_CLIENT_SECRET: ${YOUTUBE_CLIENT_SECRET:-}
      PINTEREST_CLIENT_ID: ${PINTEREST_CLIENT_ID:-}
      PINTEREST_CLIENT_SECRET: ${PINTEREST_CLIENT_SECRET:-}
      TIKTOK_CLIENT_ID: ${TIKTOK_CLIENT_ID:-}
      TIKTOK_CLIENT_SECRET: ${TIKTOK_CLIENT_SECRET:-}
    volumes:
      - lanza-config:/config/
    networks:
      - lanza-network
      - temporal-network
    depends_on:
      lanza-postgres:
        condition: service_healthy
      lanza-redis:
        condition: service_healthy

  lanza-postgres:
    image: postgres:17-alpine
    container_name: lanza-postgres
    restart: always
    environment:
      POSTGRES_USER: lanza
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: lanza
    volumes:
      - postgres-volume:/var/lib/postgresql/data
    networks:
      - lanza-network
    healthcheck:
      test: pg_isready -U lanza -d lanza
      interval: 10s
      timeout: 3s
      retries: 5

  lanza-redis:
    image: redis:7.2
    container_name: lanza-redis
    restart: always
    healthcheck:
      test: redis-cli ping
      interval: 10s
      timeout: 3s
      retries: 5
    volumes:
      - redis-data:/data
    networks:
      - lanza-network

  # ---- Temporal (motor de tareas programadas de Postiz) ----
  temporal-elasticsearch:
    container_name: temporal-elasticsearch
    image: elasticsearch:7.17.27
    restart: always
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
      - xpack.security.enabled=false
    networks:
      - temporal-network
    expose:
      - 9200
    volumes:
      - temporal-es-data:/usr/share/elasticsearch/data

  temporal-postgresql:
    container_name: temporal-postgresql
    image: postgres:16
    restart: always
    environment:
      POSTGRES_PASSWORD: ${TEMPORAL_DB_PASSWORD}
      POSTGRES_USER: temporal
    networks:
      - temporal-network
    expose:
      - 5432
    volumes:
      - temporal-pg-data:/var/lib/postgresql/data

  temporal:
    container_name: temporal
    image: temporalio/auto-setup:1.28.1
    restart: always
    depends_on:
      - temporal-postgresql
      - temporal-elasticsearch
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=${TEMPORAL_DB_PASSWORD}
      - POSTGRES_SEEDS=temporal-postgresql
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
      - ENABLE_ES=true
      - ES_SEEDS=temporal-elasticsearch
      - ES_VERSION=v7
      - TEMPORAL_NAMESPACE=default
    networks:
      - temporal-network
    volumes:
      - ../dynamicconfig:/etc/temporal/config/dynamicconfig

volumes:
  postgres-volume:
  redis-data:
  lanza-config:
  caddy-data:
  caddy-config:
  temporal-es-data:
  temporal-pg-data:

networks:
  lanza-network:
  temporal-network:
    name: temporal-network
